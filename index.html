<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مام سێڤۆ</title>
<style>
:root{--bg:#f6f7fb;--card:rgba(255,255,255,.72);--tx:#111827;--mu:#6b7280;--ac:#e11d48;--bd:rgba(17,24,39,.09);--bot:#eef0f6;--rb:#94a3b8;--ey:#0ea5e9;--wr:#fef3c7;--wt:#92400e;--er:#fee2e2;--et:#991b1b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0e1a;--card:rgba(255,255,255,.06);--tx:#e5e7eb;--mu:#9ca3af;--ac:#fb3a5d;--bd:rgba(255,255,255,.1);--bot:rgba(255,255,255,.08);--rb:#475569;--ey:#38bdf8;--wr:#422006;--wt:#fde68a;--er:#450a0a;--et:#fecaca}}
:root[data-theme="dark"]{--bg:#0a0e1a;--card:rgba(255,255,255,.06);--tx:#e5e7eb;--mu:#9ca3af;--ac:#fb3a5d;--bd:rgba(255,255,255,.1);--bot:rgba(255,255,255,.08);--rb:#475569;--ey:#38bdf8;--wr:#422006;--wt:#fde68a;--er:#450a0a;--et:#fecaca}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
main{max-width:720px;height:100%;margin:0 auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:1.4rem;margin:0;color:var(--ac)}
header p{margin:2px 0 0;color:var(--mu);font-size:.8rem}
select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px;font:inherit;font-size:.85rem}
.note{background:var(--wr);color:var(--wt);border-radius:10px;padding:8px 12px;font-size:.8rem}
.err{background:var(--er);color:var(--et);border-radius:10px;padding:8px 12px;font-size:.85rem}
.hide{display:none}
.robot{position:relative;display:flex;justify-content:center;align-items:center;min-height:190px;overflow:hidden}
.robot svg{position:relative;z-index:1;width:140px;height:152px}
.eye{fill:#1e293b;transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.mouth{fill:#7f1d1d;transform-box:fill-box;transform-origin:center}
.talking .mouth{animation:talk .28s infinite alternate}
.listening .face{stroke:#ef4444;stroke-width:5}
.busy .brow{animation:bob .6s infinite alternate}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1.6)}}
@keyframes bob{to{transform:translateY(-4px)}}
#chat{flex:1;overflow-y:auto;background:var(--card);border:3px double #b91c1c;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.empty{margin:auto;text-align:center;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:1.05rem;margin-bottom:4px}
.m{max-width:88%;display:flex;flex-direction:column}
.m.user{align-self:flex-end}
.m.bot{align-self:flex-start}
.m small{color:var(--mu);font-size:.7rem;margin:0 4px 2px}
.m p{margin:0;padding:10px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.7}
.user p{background:var(--ac);color:#fff}
.bot p{background:var(--bot);border-inline-start:4px solid #15803d}
.m button{align-self:flex-start;background:none;border:0;color:var(--mu);cursor:pointer;font-size:1rem;padding:2px 6px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px}
.row{display:flex;align-items:center;gap:14px}
#mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:2rem;cursor:pointer;box-shadow:0 0 0 4px #fbbf24,0 0 0 7px #15803d,0 6px 16px rgba(0,0,0,.3)}
#mic.on{background:#dc2626;animation:pulse 1s infinite}
#mic:disabled{opacity:.4;cursor:not-allowed}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(220,38,38,.2)}}
#stop{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-size:.85rem;cursor:pointer}
#stop:disabled{opacity:.4;cursor:not-allowed}
#st{font-size:.85rem;color:var(--mu);margin:0;min-height:1.2em}
#interim{color:var(--ac);font-size:.85rem;min-height:1.2em;text-align:center}
form{display:flex;gap:8px;width:100%}
input{flex:1;min-width:0;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;font:inherit}
form button{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:0 18px;font:inherit;cursor:pointer}
form button:disabled{opacity:.4}
.disc{text-align:center;color:var(--mu);font-size:.7rem;margin:0}
.rug{flex:none;height:16px;border-top:3px solid #15803d;border-bottom:3px solid #15803d;border-radius:4px;background-color:#b91c1c;background-image:linear-gradient(135deg,#fde68a 25%,transparent 25%),linear-gradient(225deg,#fde68a 25%,transparent 25%);background-size:16px 16px;background-repeat:repeat-x}
.sun{position:absolute;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,#fde68a 0 40%,transparent 41%),repeating-conic-gradient(#f59e0b 0 8.57deg,transparent 8.57deg 17.14deg);animation:spin 80s linear infinite;opacity:.9}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.sun{animation:none}}

.face i{position:absolute;inset:0;display:block;pointer-events:none}
.face .mouth2{inset:auto;left:63.4%;top:67.2%;width:10%;height:3.2%;background:radial-gradient(ellipse at center,#2a0a0c 50%,transparent 75%);transform-origin:50% 0;transform:scaleY(var(--o));transition:transform .1s}
.face .jaw{background:var(--img) 0 0/100% 100%;-webkit-mask-image:radial-gradient(ellipse 11% 10.5% at 68.5% 76.5%,#000 45%,transparent 100%);mask-image:radial-gradient(ellipse 11% 10.5% at 68.5% 76.5%,#000 45%,transparent 100%);transform:translateY(calc(var(--o)*1.8%));transition:transform .1s}
.listening .face{border-color:#ef4444}
.busy .face{animation:bob .6s infinite alternate}
.jamana{flex:none;position:relative;height:16px;margin-bottom:14px;border-radius:6px 6px 0 0;background:repeating-linear-gradient(90deg,#b91c1c 0 14px,#f8fafc 14px 20px,#111 20px 34px,#f8fafc 34px 40px)}
.jamana::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;background:repeating-linear-gradient(90deg,#b91c1c 0 2px,transparent 2px 6px,#f8fafc 6px 8px,transparent 8px 12px,#111 12px 14px,transparent 14px 20px);transform-origin:top;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:skewX(-6deg)}to{transform:skewX(6deg)}}
.rug{animation:slide 5s linear infinite}
@keyframes slide{to{background-position:16px 0}}
.robot::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fde68a 1.5px,transparent 2.5px),radial-gradient(#fff 1px,transparent 2px);background-size:34px 34px,23px 23px;background-position:0 0,11px 17px;animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.7}to{opacity:.15}}
#chat{background-image:radial-gradient(var(--bd) 1px,transparent 1.6px);background-size:14px 14px}
#mic:not(.on):not(:disabled){animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07)}}
h1::before,h1::after{content:"✦";color:#f4b400;font-size:.8em;margin:0 .3em}
.govend{flex:none;display:flex;justify-content:center;align-items:flex-end;gap:4px;height:56px;overflow:hidden}
.govend span{position:relative;width:20px;height:30px;border-radius:10px 10px 3px 3px;background:var(--c);animation:hop .9s ease-in-out infinite;animation-delay:calc(var(--i)*-.1s)}
.govend span::before{content:"";position:absolute;left:3px;top:-14px;width:14px;height:14px;border-radius:50%;background:#e8b27a;border-top:5px solid #b91c1c;box-sizing:border-box}
.govend span::after{content:"";position:absolute;left:100%;top:12px;width:4px;height:3px;background:#e8b27a}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@media(prefers-reduced-motion:reduce){.govend span,.jamana::after,.rug,#mic,.robot::before{animation:none!important}}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(225,29,72,.18),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(245,158,11,.16),transparent 60%),var(--bg);background-attachment:fixed}
h1{color:var(--tx);font-weight:800;letter-spacing:-.01em}
h1::before,h1::after{content:none}
select{border-radius:999px;padding:8px 14px;background:var(--card);border:1px solid var(--bd)}
.note,.err{border-radius:14px}
.jamana{height:5px;margin-bottom:4px;border-radius:99px;background:linear-gradient(90deg,#dc2626 33%,#f8fafc 33% 66%,#16a34a 66%);box-shadow:0 0 0 1px var(--bd)}
.jamana::after{display:none}
.rug{height:5px;border:0;border-radius:99px;background:linear-gradient(90deg,#dc2626 33%,#f8fafc 33% 66%,#16a34a 66%);animation:none;box-shadow:0 0 0 1px var(--bd)}
.robot::before{display:none}
.sun{opacity:.35}
.face{border:3px solid rgba(255,255,255,.9);box-shadow:0 0 0 3px #e11d48,0 0 40px rgba(245,158,11,.55),0 10px 30px rgba(0,0,0,.35)}
.listening .face{border-color:#fff;box-shadow:0 0 0 3px #ef4444,0 0 50px rgba(239,68,68,.65),0 10px 30px rgba(0,0,0,.35)}
#chat{background:var(--card);background-image:none;border:1px solid var(--bd);border-radius:24px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.08)}
.m p{padding:11px 16px;border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.bot p{border-inline-start:0}
.user p{background:linear-gradient(135deg,#e11d48,#f59e0b);color:#fff}
#mic{width:88px;height:88px;background:linear-gradient(135deg,#e11d48,#f59e0b);box-shadow:0 10px 30px rgba(225,29,72,.45)}
#mic.on{background:linear-gradient(135deg,#dc2626,#7f1d1d)}
#stop{background:var(--card);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
input{border-radius:999px;background:var(--card);border:1px solid var(--bd);padding:12px 18px}
form button{border-radius:999px;background:linear-gradient(135deg,#e11d48,#f59e0b);font-weight:600;padding:0 22px}
.govend{transform:scale(.85);transform-origin:bottom center}
.hdr{display:flex;gap:8px;align-items:center}
#gear{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:1rem}
.krow{display:flex;gap:6px;margin-top:8px}
.krow button{border:0;border-radius:999px;padding:8px 14px;background:linear-gradient(135deg,#e11d48,#f59e0b);color:#fff;font:inherit;cursor:pointer}
.krow button:last-child{background:var(--card);color:var(--tx);border:1px solid var(--bd)}

<body>

<div class="jamana"></div>
<header>
  <div><h1 data-k="title"></h1><p data-k="sub"></p></div>
  <div class="hdr"><select id="lang" aria-label="Language">
    <option value="ckb">کوردی سۆرانی</option>
    <option value="bdn">Kurdî Badînî</option>
    <option value="ar">العربية</option>
    <option value="en">English</option>
  </select><button id="gear" type="button" aria-label="API key">⚙</button></div>
</header>
<div id="notes"></div>
<div id="keybox" class="note hide"><b data-k="keyT"></b><p data-k="keyH" style="margin:4px 0 0"></p><div class="krow"><input id="keyin" type="password" dir="ltr" placeholder="sk-..." autocomplete="off"><button id="keysave" type="button" data-k="save"></button><button id="keyclr" type="button" data-k="clear"></button></div></div>
<div class="robot" id="robot"><div class="sun"></div>

</div>
<div id="chat" aria-live="polite"></div>
<div id="err" class="err hide" role="alert"></div>
<div class="ctl">
  <div id="interim" dir="auto"></div>
  <div class="row">
    <button id="mic" aria-label="mic">🎤</button>
    <button id="stop" data-k="stop" disabled></button>
  </div>
  <p id="st"></p>
  <form id="f"><input id="in" dir="auto" autocomplete="off"><button id="send" data-k="send"></button></form>
</div>
<p class="disc" data-k="disc"></p>
<div class="govend" aria-hidden="true"><span style="--i:0;--c:#b91c1c"></span><span style="--i:1;--c:#15803d"></span><span style="--i:2;--c:#7c3aed"></span><span style="--i:3;--c:#f59e0b"></span><span style="--i:4;--c:#0ea5e9"></span><span style="--i:5;--c:#db2777"></span><span style="--i:6;--c:#15803d"></span><span style="--i:7;--c:#b91c1c"></span><span style="--i:8;--c:#7c3aed"></span></div>
<div class="rug"></div>
</main>

e_notAllowed:"Destûr ji mîkrofonê re nehat dayîn. Ji kerema xwe di sazkariyên gerokê de destûrê bide û dîsa biceribîne.",e_noSpeech:"Dengek nehat bihîstin. Ji kerema xwe dîsa biceribîne.",e_lang:"Ev gerok vê zimanî nas nake. Zimanekî din hilbijêre an pirsa xwe binivîse.",e_audio:"Mîkrofonek nehat dîtin. Ji kerema xwe mîkrofona xwe kontrol bike.",e_net:"Pirsgirêkeke înternetê çêbû. Ji kerema xwe dîsa biceribîne.",e_speech:"Di naskirina dengê de pirsgirêkek çêbû. Ji kerema xwe dîsa biceribîne.",e_ai:"Bibore, pirsgirêkek çêbû. Ji kerema xwe dîsa biceribîne.",e_off:"Mifteya API tune. Bişkoka ⚙ bitikîne û mifteya xwe ya OpenAI têxe.",e_rate:"Hejmara daxwazan zêde ye. Ji kerema xwe hinekî bisekine."},

noMic:"هذا المتصفح لا يدعم التعرف على الصوت. استخدم Chrome أو Edge، أو اكتب سؤالك.",noTts:"هذا المتصفح لا يدعم قراءة الردود بصوت عالٍ.",noVoice:"لم يتم العثور على صوت مناسب على جهازك، وقد يكون النطق غير دقيق.",
disc:"دعم الصوت يختلف حسب المتصفح والجهاز وقد لا يكون دقيقًا تمامًا.",
e_notAllowed:"لم يُسمح باستخدام الميكروفون. اسمح به من إعدادات المتصفح ثم حاول مجددًا.",e_noSpeech:"لم يتم سماع أي صوت. حاول مرة أخرى.",e_lang:"هذا المتصفح لا يتعرف على هذه اللغة. اختر لغة أخرى أو اكتب سؤالك.",e_audio:"لم يتم العثور على ميكروفون.",e_net:"حدثت مشكلة في الشبكة. حاول مرة أخرى.",e_speech:"حدثت مشكلة في التعرف على الصوت. حاول مرة أخرى.",e_ai:"عذرًا، حدثت مشكلة. حاول مرة أخرى.",e_off:"لا يوجد مفتاح API. اضغط ⚙ وأدخل مفتاح OpenAI الخاص بك.",e_rate:"عدد الطلبات كبير. انتظر قليلًا."},
en:{title:"Mam Sevo",sub:"Press the microphone button and speak",tap:"Tap to speak",listen:"Listening… tap to stop",think:"Thinking…",stop:"Stop voice",ph:"Or type here…",send:"Send",you:"You",bot:"Mam Sevo",hi:"Hello! I'm Mam Sevo. How can I help you?",hint:"Press the microphone and ask your question.",
noMic:"This browser does not support speech recognition. Use Chrome or Edge, or type your question.",noTts:"This browser cannot read replies aloud.",noVoice:"No matching voice found on this device; pronunciation may be wrong.",
disc:"Voice support varies by browser and device and may not be perfect.",
e_notAllowed:"Microphone access was not allowed. Allow it in your browser settings and try again.",e_noSpeech:"No speech was heard. Please try again.",e_lang:"This browser can't recognize this language. Pick another or type.",e_audio:"No microphone was found.",e_net:"A network problem occurred. Please try again.",e_speech:"A speech recognition problem occurred. Please try again.",e_ai:"Sorry, something went wrong. Please try again.",e_off:"No API key set. Tap ⚙ and enter your own OpenAI key.",e_rate:"Too many requests. Please wait a moment."}};
const KS={
ckb:{keyT:"کلیلی OpenAI API",keyH:"کلیلەکەت تەنها لەسەر ئەم ئامێرەت دەمێنێتەوە و ڕاستەوخۆ بۆ OpenAI دەنێردرێت. لە platform.openai.com وەریبگرە.",save:"پاشەکەوتکردن",clear:"سڕینەوە",e_secure:"مایکرۆفۆن تەنها لەسەر لاپەڕەی https یان localhost کار دەکات. لاپەڕەکە بخەرە سەر Vercel یان Netlify.",inapp:"ئەم لینکە لە ناو ئەپێکی تر (WhatsApp، Instagram…) کراوەتەوە و مایکرۆفۆن ڕەنگە کارنەکات. لینکەکە لە Chrome بکەرەوە."},
bdn:{keyT:"Mifteya OpenAI API",keyH:"Mifteya te ten\u00ea li ser v\u00ea am\u00fbr\u00ea dim\u00eene \u00fb rasterast ji OpenAI re t\u00ea \u015fandin. Ji platform.openai.com w\u00ea bist\u00eene.",save:"Tomar bike",clear:"J\u00ea bibe",e_secure:"M\u00eekrofon ten\u00ea li ser r\u00fbpel\u00ean https an localhost dixebite.",inapp:"Ev l\u00eenk di nav sepanek din de (WhatsApp, Instagram\u2026) hatiye vekirin \u00fb dibe ku m\u00eekrofon nexebite. W\u00ea di Chrome de veke."},
ar:{keyT:"مفتاح OpenAI API",keyH:"يبقى المفتاح على جهازك فقط ويُرسل مباشرة إلى OpenAI. احصل عليه من platform.openai.com.",save:"حفظ",clear:"حذف",e_secure:"الميكروفون يعمل فقط على صفحات https أو localhost.",inapp:"تم فتح الرابط داخل تطبيق آخر (WhatsApp، Instagram…) وقد لا يعمل الميكروفون. افتحه في Chrome."},
en:{keyT:"OpenAI API key",keyH:"Your key stays on this device only and is sent directly to OpenAI. Get one at platform.openai.com.",save:"Save",clear:"Clear",e_secure:"The microphone only works on https pages or localhost.",inapp:"This link is open inside another app (WhatsApp, Instagram\u2026) so the mic may not work. Open it in Chrome."}};
for(const k in KS)Object.assign(S[k],KS[k]);
const L={ckb:{tag:"ckb",dir:"rtl",sr:"ckb-IQ",v:["ckb"],fb:["ar"],note:""},bdn:{tag:"ku",dir:"ltr",sr:"ku",v:["ku"],fb:["tr"],note:" The user selected Kurdish Badini (Kurmanji dialect), so IGNORE the instruction about Sorani and Arabic script: reply in clear, natural Badini Kurmanji written in Latin (Hawar) script."},ar:{tag:"ar",dir:"rtl",sr:"ar-SA",v:["ar"],fb:[],note:" The user selected Arabic, so reply in clear Modern Standard Arabic instead."},en:{tag:"en",dir:"ltr",sr:"en-US",v:["en"],fb:[],note:" The user selected English, so reply in clear English instead."}};
const SYS="Your name is Mam Sevo (مام سێڤۆ): a kind, wise, warm elderly Kurdish man who loves to help. You are a helpful voice assistant. Always reply in clear, natural Kurdish Sorani written in Arabic Kurdish script. Keep answers concise unless the user asks for detail. Be polite and helpful. Your reply is read aloud, so use plain sentences with no markdown or emojis.";
const $=id=>document.getElementById(id);
const INAPP=/FBAN|FBAV|Instagram|Snapchat|TikTok|; wv\)/i.test(navigator.userAgent);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition, synth="speechSynthesis" in window;
let lang="ckb",hist=[],busy=false,rec=null,on=false,tok=0,voices=[],discard=false,fin="",tmp="";
const t=k=>S[lang][k];

function applyLang(){
  const c=L[lang];document.documentElement.lang=c.tag;document.documentElement.dir=c.dir;
  document.querySelectorAll("[data-k]").forEach(e=>e.textContent=t(e.dataset.k));
  $("in").placeholder=t("ph");status();notes();if(!hist.length)render();
}
function status(){$("st").textContent=on?t("listen"):busy?t("think"):t("tap");$("mic").disabled=!SR||busy;$("mic").classList.toggle("on",on);$("robot").className="robot"+(on?" listening":"")+(busy?" busy":"")+($("robot").classList.contains("talking")?" talking":"")}
function fv(p){for(const x of p){const v=voices.find(v=>{const l=v.lang.toLowerCase().replace("_","-");return l===x||l.startsWith(x+"-")});if(v)return v}return null}
function notes(){const n=[];if(INAPP)n.push(t("inapp"));if(!SR)n.push(t("noMic"));if(!synth)n.push(t("noTts"));else if((lang==="ckb"||lang==="bdn")&&voices.length&&!fv(L[lang].v))n.push(t("noVoice"));
  $("notes").replaceChildren(...n.map(x=>{const d=document.createElement("div");d.className="note";d.textContent=x;return d}))}
function showErr(k){const e=$("err");if(!k){e.classList.add("hide");return}e.textContent=t(k);e.classList.remove("hide")}
function render(){
  const c=$("chat");c.replaceChildren();
  if(!hist.length){const d=document.createElement("div");d.className="empty";d.innerHTML="<b></b><span></span>";d.firstChild.textContent=t("hi");d.lastChild.textContent=t("hint");c.append(d);return}
  hist.forEach(m=>{
    const d=document.createElement("div");d.className="m "+(m.role==="user"?"user":"bot");
    const s=document.createElement("small");s.textContent=m.role==="user"?t("you"):t("bot");
    const p=document.createElement("p");p.dir="auto";p.textContent=m.content;d.append(s,p);
    if(m.role==="assistant"&&synth){const b=document.createElement("button");b.textContent="🔊";b.onclick=()=>speak(m.content);d.append(b)}
    c.append(d);
  });
  if(busy){const d=document.createElement("div");d.className="empty";d.style.margin="0";d.textContent=t("think");c.append(d)}
  c.scrollTop=c.scrollHeight;
}

/* ---- voice output ---- */
function stopVoice(){tok++;if(synth)speechSynthesis.cancel();setTalk(false)}
let jt=null;function setTalk(v){$("robot").classList.toggle("talking",v);$("stop").disabled=!v;clearInterval(jt);const f=$("face");if(v)jt=setInterval(()=>f.style.setProperty("--o",(.25+Math.random()*.75).toFixed(2)),120);else f.style.setProperty("--o",0)}
function speak(raw){
  if(!synth)return;
  const text=raw.replace(/\[(.*?)\]\(.*?\)/g,"$1").replace(/[*_#`>~]/g,"").replace(/\s+/g," ").trim();if(!text)return;
  speechSynthesis.cancel();const my=++tok,c=L[lang],voice=fv(c.v)||fv(c.fb);
  const parts=[];let cur="";
  for(const s of text.split(/(?<=[.!?؟۔…\n])\s+/)){const j=cur?cur+" "+s:s;if(j.length>180&&cur){parts.push(cur);cur=s}else cur=j}
  if(cur)parts.push(cur);
  parts.forEach((p,i)=>{
    const u=new SpeechSynthesisUtterance(p);u.lang=voice?voice.lang:c.sr;if(voice)u.voice=voice;u.rate=.95;
    if(i===0)u.onstart=()=>{if(my===tok)setTalk(true)};
    const end=()=>{if(my===tok&&i===parts.length-1)setTalk(false)};u.onend=end;u.onerror=end;speechSynthesis.speak(u);
  });
}
if(synth){const lv=()=>{voices=speechSynthesis.getVoices();notes()};lv();speechSynthesis.addEventListener("voiceschanged",lv)}

/* ---- AI ---- */
const KEY="mamsevo_key";
function getKey(){try{return localStorage.getItem(KEY)||""}catch{return ""}}
async function ask(){
  const h=hist.slice(-10);while(h.length&&h[0].role!=="user")h.shift();
  const k=getKey();let r;
  try{
    if(k){
      r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+k},body:JSON.stringify({model:"gpt-4o-mini",max_completion_tokens:700,messages:[{role:"system",content:SYS+L[lang].note},...h]})});
      const d=await r.json().catch(()=>null);
      if(r.status===401)throw{code:"nokey"};
      if(r.status===429)throw{code:"rate_limited"};
      const t=d&&d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
      if(!r.ok||!t)throw{code:"ai"};
      return t.trim();
    }
    if(location.protocol==="file:")throw{code:"nokey"};
    r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({language:lang,messages:h})});
  }catch(e){if(e&&e.code)throw e;throw{code:"net"}}
  const d=await r.json().catch(()=>null);
  if(!r.ok||!d||!d.reply)throw{code:(d&&d.error==="key")||r.status===404||r.status===405?"nokey":r.status===429?"rate_limited":"ai"};
  return d.reply;
}
async function send(text){
  text=text.trim();if(!text||busy)return;
  stopVoice();showErr(null);hist.push({role:"user",content:text});busy=true;render();status();
  try{const r=await ask();hist.push({role:"assistant",content:r});busy=false;render();status();speak(r)}
  catch(e){busy=false;hist.pop();render();status();
    $("in").value=text;if(e&&e.code==="nokey")openKey();showErr(e&&(e.code==="off"||e.code==="nokey"||e.code==="not_granted")?"e_off":e&&e.code==="rate_limited"?"e_rate":e&&e.code==="net"?"e_net":"e_ai")}
}

/* ---- voice input ---- */
function startRec(){
  stopVoice();showErr(null);fin="";tmp="";discard=false;$("interim").textContent="";
  rec=new SR();rec.lang=L[lang].sr;rec.continuous=false;rec.interimResults=true;
  rec.onresult=e=>{let i2="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else i2+=r[0].transcript}tmp=i2;$("interim").textContent=i2};
  rec.onerror=e=>{const m={"not-allowed":"e_notAllowed","service-not-allowed":"e_notAllowed","no-speech":"e_noSpeech","language-not-supported":"e_lang","audio-capture":"e_audio",network:"e_net"};if(e.error!=="aborted")showErr(m[e.error]||"e_speech")};
  rec.onend=()=>{on=false;rec=null;$("interim").textContent="";status();const x=(fin||tmp).trim();if(!discard&&x)send(x);discard=false};
  try{rec.start();on=true;status()}catch{showErr("e_speech")}
}
$("mic").onclick=async()=>{
  if(on&&rec){rec.stop();return}
  if(!window.isSecureContext){showErr("e_secure");return}
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(x=>x.stop())}
    catch(e){showErr(e&&(e.name==="NotFoundError"||e.name==="DevicesNotFoundError")?"e_audio":"e_notAllowed");return}
  }
  startRec();
};
function openKey(){$("keyin").value=getKey();$("keybox").classList.remove("hide")}
$("gear").onclick=()=>{if($("keybox").classList.contains("hide"))openKey();else $("keybox").classList.add("hide")};
$("keysave").onclick=()=>{try{const v=$("keyin").value.trim();v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY)}catch{}$("keybox").classList.add("hide");showErr(null)};
$("keyclr").onclick=()=>{try{localStorage.removeItem(KEY)}catch{}$("keyin").value=""};
$("stop").onclick=stopVoice;
$("f").onsubmit=e=>{e.preventDefault();const v=$("in").value;$("in").value="";send(v)};
$("lang").onchange=e=>{if(rec){discard=true;rec.abort()}stopVoice();showErr(null);lang=e.target.value;applyLang()};
applyLang();
</script>
</body>
</html>
